name: Bug report
description: Report a bug in the NodeStats Rust collector CLI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NodeStats version (`nodestats --version`)
      placeholder: "0.2.5"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS & architecture
      placeholder: "Ubuntu 24.04 x86_64 / macOS 15 arm64"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant logs or output
      render: shell
